<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"><title>レシート読み取り検証｜くらしストック</title><link rel="stylesheet" href="./style.css"></head><body><main>
<a href="../">くらしストックに戻る</a><h1>レシート読み取り検証</h1><p>写真を選び、新しい読み取り方式を試せます。写真と結果は送信・保存しません。</p>
<form id="scan-form"><label for="photo">レシート写真</label><input id="photo" type="file" accept="image/*"><label for="scale">画像の処理</label><select id="scale"><option value="gray">拡大・グレー化（比較用）</option><option value="original">元の色のまま</option></select><button id="scan" type="submit" disabled>読み取りを試す</button></form>
<p id="status" role="status" aria-live="polite">写真を選んでください。初回は読み取りに必要なデータをダウンロードします。</p><p id="elapsed" class="muted"></p><button id="reset" type="button">写真と結果を破棄</button>
<section id="result" hidden><h2>読み取り結果</h2><p>商品名・金額を原本と比べてください。この画面から購入記録は登録されません。</p><dl id="metrics"></dl><label for="text">文字起こし（位置から行を整理）</label><textarea id="text" readonly rows="14"></textarea><button id="copy" type="button">結果と計測情報をコピー</button><p id="copy-status" role="status"></p><details><summary>抽出した明細候補</summary><p>誤読や対応違いを含むことがあります。</p><pre id="items"></pre></details><details><summary>診断情報</summary><pre id="diagnostic"></pre></details></section>
<p class="muted">動作が止まった場合は、このページを閉じて開き直せます。初回の待ち時間と、2回目の読み取り時間を分けて確認します。</p>
</main><script type="module" src="./main.js"></script></body></html>
