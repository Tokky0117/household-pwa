name: Audit existing GAS web-app deployment (read only)
on:
  push:
    branches: [stage-a-ui-handoff-review]
    paths: ['.github/workflows/gas-source-identify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the exact existing GAS script and prepare temporary auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID_TEST: ${{ secrets.GAS_SCRIPT_ID_TEST }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/existing-gas-webapp"
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const id=process.env.GAS_SCRIPT_ID_TEST,credentials=process.env.CLASPRC_JSON;
          if(!id||!credentials)throw Error('GAS_CREDENTIALS_MISSING');
          if(crypto.createHash('sha256').update(id).digest('hex')!==
            '9c4113806442904861bb84dede2d9c542449a5c9ed5b494abe451cda0c1f4739')
            throw Error('WRONG_GAS_SCRIPT_ID');
          fs.writeFileSync(path.join(process.env.HOME,'.clasprc.json'),credentials,{mode:0o600});
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'existing-gas-webapp','.clasp.json'),
            JSON.stringify({scriptId:id,rootDir:'.'})+'\n',{mode:0o600});
          NODE
      - name: Read existing deployments without changing source or webapp
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/existing-gas-webapp"
          npx --yes @google/clasp@3 list-deployments > "$RUNNER_TEMP/existing-gas-deployments.txt"
          cd "$GITHUB_WORKSPACE"
          node - <<'NODE'
          const fs=require('node:fs');
          const out=fs.readFileSync(process.env.RUNNER_TEMP+'/existing-gas-deployments.txt','utf8');
          const ids=[...new Set(out.match(/AKfy[A-Za-z0-9_-]{20,}/g)||[])];
          const entry=fs.readFileSync('index.html','utf8');
          const url=entry.match(/KurashiGasApi\.configure\("https:\/\/script\.google\.com\/macros\/s\/([A-Za-z0-9_-]+)\/exec"\)/)?.[1];
          if(!url)throw Error('PWA_GAS_ENDPOINT_NOT_FOUND');
          const matched=ids.includes(url);
          const message=JSON.stringify({existing_webapp_deployment_count:ids.length,
           pwa_target_matches_existing_test_script:matched,
           pwa_target_count:ids.filter(id=>id===url).length,
           has_other_webapp_ids:ids.filter(id=>id!==url).length>0});
          console.log('EXISTING_GAS_WEBAPP_AUDIT '+message);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,message+'\n');
          if(!matched){
           // Google Apps Script deployment IDs are public URL identifiers,
           // not authorization credentials. Surface candidate URLs only when
           // the configured PWA target is not from this exact verified script.
           for(const id of ids){
            if(id.length>30&&id.length<250)console.log('VERIFIED_TEST_GAS_DEPLOYMENT https://script.google.com/macros/s/'+id+'/exec');
           }
          }
          NODE
      - name: Destroy temporary token and deployment inventory
        if: always()
        shell: bash
        run: rm -rf "$HOME/.clasprc.json" "$RUNNER_TEMP/existing-gas-webapp" "$RUNNER_TEMP/existing-gas-deployments.txt"
