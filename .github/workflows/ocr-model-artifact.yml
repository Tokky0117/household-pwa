name: Export public PaddleOCR v6 model binaries for offline local testing
on:
  push:
    branches: [stage-a-ui-handoff-review]
    paths:
      - '.github/workflows/ocr-model-artifact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download and verify public model binaries only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/paddle-model
          for role in det rec; do
            if [ "$role" = det ]; then
              model="PP-OCRv6_small_det_onnx_infer"
              sha=d218f6fbf0f1c23d2161bd6ac7f5eaa6104fa89955c09290497e31008e2618e4
            else
              model="PP-OCRv6_small_rec_onnx_infer"
              sha=d267ab077a44a0eedb1ea8f8c542d263f211de8e9d7a029bf9fcfff7e5a88fb1
            fi
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 180               "https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0/$model.tar"               -o "/tmp/paddle-model/v6-$role.tar"
            echo "$sha  /tmp/paddle-model/v6-$role.tar" | sha256sum -c -
          done
          ls -lah /tmp/paddle-model
      - name: Attach public models only (no receipt images)
        uses: actions/upload-artifact@v4
        with:
          name: paddle-v6-public-models
          path: /tmp/paddle-model/v6-*.tar
          retention-days: 1
          compression-level: 0
