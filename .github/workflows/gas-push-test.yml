name: Update existing household GAS source (manual)
# Updates script SOURCE only. Never creates a deployment, GAS, Sheet or record.
on:
  push:
    branches: [stage-a-ui-handoff-review]
    paths: ['.github/workflows/gas-push-test.yml']
  workflow_dispatch:
    inputs:
      confirm_existing_target:
        description: '既存のGASへソース反映を許可する場合 UPDATE_EXISTING_GAS'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: household-gas-source-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/stage-a-ui-handoff-review' && ((github.event_name == 'push' && github.event.head_commit.message == 'Trigger one-time verified update of existing GAS source') || (github.event_name == 'workflow_dispatch' && inputs.confirm_existing_target == 'UPDATE_EXISTING_GAS'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reviewed regular-save source
        run: |
          set -euo pipefail
          cp gas/Code.gs "$RUNNER_TEMP/household-gas.js"
          node --check "$RUNNER_TEMP/household-gas.js"
          # Any subsequent GAS source edit requires reviewing this workflow again.
          test "$(git hash-object gas/Code.gs)" = "bff3899654d6a7fff055de11baa0fcb3ca484407"
          node tests/gas-normal-dispatch.mjs
          node tests/receipt-save-parity.mjs
          node tests/gas-auth-isolation.mjs
      - name: Verify pinned GAS project and prepare temporary credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID_TEST: ${{ secrets.GAS_SCRIPT_ID_TEST }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/household-gas/remote" "$RUNNER_TEMP/household-gas/stage"
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path');
          const credentials=process.env.CLASPRC_JSON,scriptId=process.env.GAS_SCRIPT_ID_TEST;
          if(!credentials||!scriptId)throw Error('GAS_CREDENTIALS_MISSING');
          if(crypto.createHash('sha256').update(scriptId).digest('hex')!==
             '9c4113806442904861bb84dede2d9c542449a5c9ed5b494abe451cda0c1f4739')
            throw Error('EXISTING_GAS_TARGET_MISMATCH');
          const auth=JSON.parse(credentials);
          if(!auth||typeof auth!=='object'||Array.isArray(auth))throw Error('CLASP_AUTH_INVALID');
          fs.writeFileSync(path.join(process.env.HOME,'.clasprc.json'),
            JSON.stringify(auth),{mode:0o600});
          for(const dir of ['remote','stage']){
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'household-gas',dir,'.clasp.json'),
              JSON.stringify({scriptId,rootDir:'.'})+'\n',{mode:0o600});
          }
          NODE
      - name: Pull current GAS source before any modification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/household-gas/remote"
          npx --yes @google/clasp@3 pull
      - name: Reject unknown source or manifest changes; stage only reviewed file
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
          const base=path.join(process.env.RUNNER_TEMP,'household-gas');
          const remoteDir=path.join(base,'remote'),stageDir=path.join(base,'stage');
          const filenames=fs.readdirSync(remoteDir).filter(n=>!n.startsWith('.')).sort();
          if(JSON.stringify(filenames)!==JSON.stringify(['appsscript.json','コード.js']))
            throw Error('REMOTE_SOURCE_LAYOUT_CHANGED');
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          const original=fs.readFileSync(path.join(remoteDir,'コード.js'),'utf8');
          const baseline=cp.execFileSync('git',
            ['show','a768edba8d61e45f444813cf5a9c2f76de3733d9:gas/Code.gs'],
            {encoding:'utf8'});
          if(sha(original)!==sha(baseline))throw Error('REMOTE_SOURCE_DRIFT_REVIEW_REQUIRED');
          const code=fs.readFileSync('gas/Code.gs','utf8');
          const fns=text=>new Set([...text.matchAll(/(?:^|\n)function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(m=>m[1]));
          const existing=fns(original),updated=fns(code);
          const allowedRemoved=new Set([
            'assertAliasEditorTrialIdentity_','assertIsolatedTrialConfigReadOnly',
            'assertIsolatedTrialIdentity','checkReceiptTrialReadOnly',
            'createFreshIsolatedWriteTrialSpreadsheet_','initializeEmptySchema_',
            'isolatedAliasTrialGuard_','isolatedTrialReadPage_','mutateAliasSafely_','mutate_',
            'receiptTrialGuard_','receiptTrialMainCreate_','receiptTrialPage_',
            'receiptTrialPayload_','receiptTrialSecondPayload_','requireIsolatedWriteTrial',
            'runAliasTrialWriteOnce','runIsolatedAliasWriteTrialOnce_',
            'runIsolatedItemWriteTrialOnce_','runReceiptWriteTrialOnce',
            'testAliasCatalogReadOnly','testAliasTrialPreflightReadOnly','testAllSheetsReadOnly',
            'testCategoriesReadOnly','testCurrentGoogleSubject',
            'testIsolatedAliasWriteTrialPreflightReadOnly_',
            'testIsolatedAliasWriteTrialResultReadOnly_',
            'testIsolatedTrialResultReadOnly','testIsolatedWriteTrialPreflightReadOnly',
            'testTrialSheetInventoryReadOnly','trialGuard_','trialPage_',
            'trialReadOnlyCounts','trialReadOnlyItemList','trialStockRead',
            'trialStockTimingReadOnly','trialStockUpdate','trialSubsetProfileOnly_',
            'verifyAliasFixtureCommitted_'
          ]);
          const removed=[...existing].filter(n=>!updated.has(n));
          const added=[...updated].filter(n=>!existing.has(n));
          if(removed.length!==allowedRemoved.size||
             removed.some(n=>!allowedRemoved.has(n))||
             added.length!==0)
            throw Error('SOURCE_FUNCTION_DIFF_NOT_REVIEWED');
          for(const fn of ['doPost','authenticate','bootstrap','mutateItemSafely_',
            'mutateProductSafely_','mutateReceiptSafely_','mutateStoreSafely_','receiptList_']){
            if(!updated.has(fn))throw Error('REQUIRED_FUNCTION_MISSING_'+fn);
          }
          for(const action of ['item.create','item.update','product.create',
            'store.create','record.create']){
            if(!code.includes("'"+action+"'"))throw Error('NORMAL_ROUTE_MISSING');
          }
          if(code.includes("if(action==='record.trial."))throw Error('TRIAL_ROUTE_STILL_PRESENT');
          const manifest=fs.readFileSync(path.join(remoteDir,'appsscript.json'),'utf8');
          if(sha(manifest)!=='0952d47f73508eb256f1cf50f0368fe77434f8c05ea0d6defc7cf9b4e227e935')
            throw Error('EXISTING_MANIFEST_DRIFT');
          const conf=JSON.parse(manifest),expected=JSON.parse(fs.readFileSync('gas/appsscript.json','utf8'));
          if(conf.runtimeVersion!=='V8'||!Array.isArray(conf.oauthScopes)||
             !expected.oauthScopes.every(s=>conf.oauthScopes.includes(s)))
            throw Error('MANIFEST_SCOPE_MISMATCH');
          fs.copyFileSync(path.join(remoteDir,'appsscript.json'),
            path.join(stageDir,'appsscript.json'));
          fs.copyFileSync('gas/Code.gs',path.join(stageDir,'コード.js'));
          console.log('BACKUP_READY: pinned existing script, reviewed change only; no Sheet accessed');
          NODE
      - name: Save original GAS source and manifest as recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: household-gas-before-trial-removal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/household-gas/remote/コード.js
            ${{ runner.temp }}/household-gas/remote/appsscript.json
          if-no-files-found: error
          retention-days: 30
      - name: Push source to same GAS (no web app deployment or Sheet writes)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/household-gas/stage"
          npx --yes @google/clasp@3 push --force
          npx --yes @google/clasp@3 pull
          cmp -s コード.js "$GITHUB_WORKSPACE/gas/Code.gs"
          echo 'GAS_SOURCE_SYNCED: original backup saved; web app version unchanged; no Sheet data touched' >> "$GITHUB_STEP_SUMMARY"
      - name: Erase temporary authentication and pulled source
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.clasprc.json" "$RUNNER_TEMP/household-gas.js"
          rm -rf "$RUNNER_TEMP/household-gas"
