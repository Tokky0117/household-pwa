name: Preview all branches on GitHub Pages

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-all-branches
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Regression checks run independently in offline-tests.yml.
      # A test failure must not block publishing read-only diagnostic pages.

      - name: Build isolated static previews
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p _site/previews
          files=(index.html app.js auth.js gas-api.js live-operation-journal.js styles.css manifest.webmanifest icon.svg sw.js gas-setup.html gas-trial-setup.html gas-trial-connection.html gas-connection-test.html gas/Code.gs)

          copy_site() {
            local ref="$1"
            local dest="$2"
            mkdir -p "$dest"
            for file in "${files[@]}"; do
              if git cat-file -e "$ref:$file" 2>/dev/null; then
                mkdir -p "$(dirname "$dest/$file")"
                git show "$ref:$file" > "$dest/$file"
              fi
            done
            [[ -f "$dest/index.html" ]]
          }

          # Keep the default branch at the normal project Pages URL.
          copy_site refs/remotes/origin/main _site

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"
            [[ "$branch" == main || "$branch" == gh-pages || "$branch" == HEAD ]] && continue
            # URL-safe branch name; original slashes become hyphens.
            slug="$(printf '%s' "$branch" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
            [[ -n "$slug" ]] || continue
            dest="_site/previews/$slug"
            if copy_site "refs/remotes/$remote_ref" "$dest"; then
              # Scope the Service Worker cache per preview to avoid cross-branch conflicts.
              if [[ -f "$dest/sw.js" ]]; then
                # Keep the branch's own cache version, but namespace its preview.
                version="$(sed -nE "s/^const CACHE='household-ui-v([0-9]+)';/\\1/p" "$dest/sw.js" | head -n 1)"
                [[ "$version" =~ ^[0-9]+$ ]] || { echo "Invalid SW cache version: $branch"; exit 1; }
                sed -i "s/const CACHE=\x27[^\x27]*\x27/const CACHE=\x27household-preview-$slug-v$version\x27/" "$dest/sw.js"
              fi
              echo "Preview: /previews/$slug/"
            else
              rm -rf "$dest"
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin)

          # GitHub Pages should serve the copied files as-is.
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy previews and main
        id: deployment
        uses: actions/deploy-pages@v4
