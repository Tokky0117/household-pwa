name: Preview all branches on GitHub Pages

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-all-branches
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser and IndexedDB regression-test dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts fake-indexeddb@6.2.4 jsdom@26.1.0

      - name: Validate v1.8 preview behavior
        if: ${{ github.ref_name != 'preview-v95-household-link-flow' && github.ref_name != 'preview-v97-product-stock-groups' && github.ref_name != 'preview-v98-product-stock-model' }}
        run: |
          node tests/ui-smoke.mjs
          node tests/no-login-household.mjs
          node tests/receipt-baseline.mjs
          node tests/receipt-seven-case-acceptance.mjs
          node tests/receipt-layout-p1.mjs
          node tests/receipt-prompt-p3.mjs
          node tests/production-build.mjs
          node tests/trial-sheet-schema-cutover.mjs
          node tests/gas-execution-result.mjs
          node tests/v94-local-snapshot-upgrade.mjs
          node tests/production-release-guards.mjs
          node tests/production-v94-converter.mjs
          node tests/production-v94-cutover-runner.mjs
          node tests/production-final-gas-verify.mjs
          node tests/production-v94-owner-manual-workflow.mjs

      # v95 changes saved-receipt navigation. The legacy end-to-end harness
      # hardcodes removed controls and must be migrated before production.
      # Keep unaffected OCR/schema regression tests and release guards active.
      - name: Validate v95 household-first preview
        if: ${{ github.ref_name == 'preview-v95-household-link-flow' }}
        run: |
          node tests/ui-smoke.mjs
          node tests/v95-household-flow.mjs
          node tests/no-login-household.mjs
          node tests/receipt-baseline.mjs
          node tests/receipt-seven-case-acceptance.mjs
          node tests/receipt-layout-p1.mjs
          node tests/receipt-prompt-p3.mjs
          node tests/production-build.mjs
          node tests/trial-sheet-schema-cutover.mjs
          node tests/gas-execution-result.mjs
          node tests/v94-local-snapshot-upgrade.mjs
          node tests/production-release-guards.mjs
          node tests/production-v94-converter.mjs
          node tests/production-v94-cutover-runner.mjs
          node tests/production-final-gas-verify.mjs
          node tests/production-v94-owner-manual-workflow.mjs

      # v97 changes the receipts tab into a price catalogue and relocates
      # history/actions to its menu. The old no-login end-to-end test hardcodes
      # the obsolete tab structure; do not pretend it validates this preview.
      # v95 receipt journaling plus the focused UI smoke suite remain active.
      - name: Validate v97 isolated product/inventory UI preview
        if: ${{ github.ref_name == 'preview-v97-product-stock-groups' || github.ref_name == 'preview-v98-product-stock-model' }}
        run: |
          node tests/ui-smoke.mjs
          node tests/v95-household-flow.mjs
          node tests/receipt-baseline.mjs
          node tests/receipt-seven-case-acceptance.mjs
          node tests/receipt-layout-p1.mjs
          node tests/receipt-prompt-p3.mjs
          node tests/trial-sheet-schema-cutover.mjs
          node tests/gas-execution-result.mjs

      - name: Validate v98 pure product stock migration model
        if: ${{ github.ref_name == 'preview-v98-product-stock-model' }}
        run: node tests/v98-product-stock-model.mjs

      - name: Build verified prior PaddleOCR for the main receipt screen
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix ocr-lab --ignore-scripts
          (cd ocr-lab && npx vite build --config vite.app.config.mjs && OCR_LAB_OUT="$PWD/dist-app" node prepare-assets.mjs)
          test -s ocr-lab/dist-app/engine.js
          test -s ocr-lab/dist-app/models/det.tar
          test -s ocr-lab/dist-app/models/rec.tar
          test -s ocr-lab/dist-app/runtime/ort-wasm-simd-threaded.wasm

      - name: Build isolated static previews
        env:
          PROD_GAS_EXEC_URL: ${{ vars.KURASHI_PRODUCTION_GAS_EXEC }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p _site/previews
          files=(index.html app.js styles.css manifest.webmanifest icon.svg sw.js live-client.js japanese-reading.js receipt-chatgpt-import.js product-package.js receipt-validation.js receipt-review-model.js)
          files+=(product-stock-model.js)

          copy_site() {
            local ref="$1"
            local dest="$2"
            mkdir -p "$dest"
            for file in "${files[@]}"; do
              if git cat-file -e "$ref:$file" 2>/dev/null; then
                git show "$ref:$file" > "$dest/$file"
              fi
            done
            [[ -f "$dest/index.html" ]]
          }

          # Root / is production after main receives the verified app.
          # Until that release, preserve the existing main site unchanged.
          copy_site refs/remotes/origin/main _site
          if git cat-file -e refs/remotes/origin/main:CURRENT_REQUIREMENTS.md 2>/dev/null \
            && git cat-file -e refs/remotes/origin/main:live-client.js 2>/dev/null; then
            if [[ -z "${PROD_GAS_EXEC_URL:-}" ]]; then
              echo "::error::Configure KURASHI_PRODUCTION_GAS_EXEC before deploying main."
              exit 1
            fi
            mkdir -p _site/ocr-engine
            cp -a ocr-lab/dist-app/. _site/ocr-engine/
            node scripts/build-production.mjs "_site/live-client.js"
            # A formal release must not retain the preview-only app name.
            sed -i 's/くらしストック_試作/くらしストック/g; s/PWA試作/PWA/g' _site/index.html _site/manifest.webmanifest
            sed -i 's/<span>試作 v/<span>v/' _site/app.js
            revision="$(git rev-parse --short=12 refs/remotes/origin/main)"
            sed -i "s/^const CACHE=[^;]*;/const CACHE='household-production-main-$revision';/" "_site/sw.js"
            echo "Production: / (main; isolated GAS, IndexedDB and service-worker cache)"
          fi

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"
            [[ "$branch" == main || "$branch" == gh-pages || "$branch" == HEAD || "$branch" == production-v1 ]] && continue
            # URL-safe branch name; original slashes become hyphens.
            slug="$(printf '%s' "$branch" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
            [[ -n "$slug" ]] || continue
            dest="_site/previews/$slug"
            if copy_site "refs/remotes/$remote_ref" "$dest"; then
              # Scope the Service Worker cache per preview to avoid cross-branch conflicts.
              if [[ -f "$dest/sw.js" ]]; then
                # Rotate the preview cache when this branch revision changes.
                # A fixed branch-only key retained stale app CSS/JS across releases.
                revision="$(git rev-parse --short=12 "refs/remotes/$remote_ref")"
                sed -i "s/^const CACHE=[^;]*;/const CACHE='household-preview-$slug-$revision';/" "$dest/sw.js"
              fi
              # Any preview whose app imports the OCR engine must publish its
              # engine, ONNX runtime and model assets in that preview's own scope.
              # Avoid v94 or future branch regressions from v46-only copying.
              if grep -Fq 'ocr-engine/engine.js' "$dest/app.js"; then
                mkdir -p "$dest/ocr-engine"
                cp -a ocr-lab/dist-app/. "$dest/ocr-engine/"
                for required in engine.js models/det.tar models/rec.tar runtime/ort-wasm-simd-threaded.wasm; do
                  test -s "$dest/ocr-engine/$required" || {
                    echo "::error::Missing OCR asset for $branch: $required"
                    exit 1
                  }
                done
                echo "OCR assets included: /previews/$slug/ocr-engine/"
              fi
              echo "Preview: /previews/$slug/"
            else
              rm -rf "$dest"
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin)

          # Serve an immutable source fingerprint outside all preview SW scopes.
          # This contains only public code revision/hashes, never household data.
          if [[ -f _site/previews/preview-v94-schema-names/app.js ]]; then
            mkdir -p _site/diagnostics
            {
              printf 'branch=preview-v94-schema-names\n'
              printf 'revision=%s\n' "$(git rev-parse --short=12 refs/remotes/origin/preview-v94-schema-names)"
              grep "^const APP_VERSION=" _site/previews/preview-v94-schema-names/app.js
              sha256sum _site/previews/preview-v94-schema-names/index.html \
                _site/previews/preview-v94-schema-names/app.js \
                _site/previews/preview-v94-schema-names/live-client.js \
                _site/previews/preview-v94-schema-names/sw.js
            } > _site/diagnostics/preview-v94-schema-names.txt
            echo "Source fingerprint: /diagnostics/preview-v94-schema-names.txt"
          fi

          # GitHub Pages should serve the copied files as-is.
          touch _site/.nojekyll

      - name: Verify assembled Pages files and OCR settings
        run: node tests/preview-asset-integrity.mjs _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Use a different artifact for each retry attempt. GitHub Actions
      # retains the earlier attempt's artifact under the same workflow run,
      # and deploy-pages fails when multiple artifacts share a name.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Deploy previews and main
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
