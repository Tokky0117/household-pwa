name: Read-only audit of existing test GAS source
# Verify remote test GAS matches the approved prototype-only alias editor preflight update.
on:
  push:
    branches: [stage-a-ui-handoff-review]
    paths: ['.github/workflows/gas-remote-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check configured test-GAS credentials and verify the exact target
        id: gate
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID_TEST: ${{ secrets.GAS_SCRIPT_ID_TEST }}
        run: |
          set -euo pipefail
          if [ -z "$CLASPRC_JSON" ] || [ -z "$GAS_SCRIPT_ID_TEST" ]; then
            echo 'READY=false' >> "$GITHUB_OUTPUT"
            echo 'READ_ONLY_GAS_AUDIT: credentials not configured; no remote access attempted' >> "$GITHUB_STEP_SUMMARY"
            echo 'READ_ONLY_GAS_AUDIT: credentials not configured; no remote access attempted'
            exit 0
          fi
          expected='9c4113806442904861bb84dede2d9c542449a5c9ed5b494abe451cda0c1f4739'
          actual="$(printf '%s' "$GAS_SCRIPT_ID_TEST" | sha256sum | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo 'READY=false' >> "$GITHUB_OUTPUT"
            echo 'READ_ONLY_GAS_AUDIT: configured test-GAS target does not match supplied target; no access attempted' >> "$GITHUB_STEP_SUMMARY"
            echo 'READ_ONLY_GAS_AUDIT: configured test-GAS target does not match supplied target; no access attempted'
            exit 0
          fi
          echo 'READY=true' >> "$GITHUB_OUTPUT"
      - name: Download current test GAS source (read-only)
        if: steps.gate.outputs.READY == 'true'
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID_TEST: ${{ secrets.GAS_SCRIPT_ID_TEST }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/remote-gas"
          node - <<'NODE'
          const fs=require('node:fs');
          const auth=JSON.parse(process.env.CLASPRC_JSON);
          const id=process.env.GAS_SCRIPT_ID_TEST;
          if(!auth||typeof auth!=='object')throw Error('Credential syntax invalid');
          if(!/^[A-Za-z0-9_-]{20,}$/.test(id))throw Error('Target syntax invalid');
          fs.writeFileSync(process.env.HOME+'/.clasprc.json',JSON.stringify(auth),{mode:0o600});
          fs.writeFileSync(process.env.RUNNER_TEMP+'/remote-gas/.clasp.json',
            JSON.stringify({scriptId:id,rootDir:'.'}),{mode:0o600});
          NODE
          cd "$RUNNER_TEMP/remote-gas"
          npx --yes @google/clasp@3 pull
          node - <<'NODE'
          const fs=require('node:fs');
          const scriptFiles=fs.readdirSync('.').filter(name=>
            /\.(js|gs)$/.test(name)&&fs.statSync(name).isFile());
          if(!scriptFiles.length)throw Error('No script source files returned by clasp');
          console.log('Read-only pull returned '+scriptFiles.length+' source file(s); content not printed');
          NODE
      - name: Compare required functions and file digest (never output source)
        if: steps.gate.outputs.READY == 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const local=fs.readFileSync('gas/Code.gs','utf8');
          const child=require('node:child_process');
          const priorSource=child.execFileSync('git',['show',
            'e00cd8f2cc8b1927ee7a899884a1bec6c5c1758b:gas/Code.gs'],
            {encoding:'utf8'});
          const path=require('node:path');
          const folder=path.join(process.env.RUNNER_TEMP,'remote-gas');
          const remoteFiles=fs.readdirSync(folder).filter(name=>
            /\.(js|gs)$/.test(name)&&fs.statSync(path.join(folder,name)).isFile()).sort();
          if(!remoteFiles.length)throw Error('No remote scripts to compare');
          const remote=remoteFiles.map(name=>fs.readFileSync(path.join(folder,name),'utf8')).join('\n');
          const functions=['productCatalog_','productAliasCheck_','mutateAliasSafely_',
            'testIsolatedAliasWriteTrialPreflightReadOnly_',
            'runIsolatedAliasWriteTrialOnce_',
            'testIsolatedAliasWriteTrialResultReadOnly_'];
          const match=functions.map(name=>({name,present:remote.includes('function '+name+'(')}));
          const declared=source=>new Set([...source.matchAll(/(?:^|\n)function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(m=>m[1]));
          const remoteDeclarations=declared(remote),localDeclarations=declared(local);
          const remoteOnly=[...remoteDeclarations].filter(name=>!localDeclarations.has(name)).sort();
          const manifestFile=fs.readFileSync('gas/appsscript.json','utf8');
          const remoteManifest=fs.readFileSync(path.join(folder,'appsscript.json'),'utf8');
          const normalManifest=text=>JSON.stringify(JSON.parse(text));
          const manifestMatches=normalManifest(manifestFile)===normalManifest(remoteManifest);
          const remoteConf=JSON.parse(remoteManifest),localConf=JSON.parse(manifestFile);
          const scopes=obj=>Array.isArray(obj.oauthScopes)?obj.oauthScopes.slice().sort():[];
          const localScopes=scopes(localConf),remoteScopes=scopes(remoteConf);
          const missingScopes=localScopes.filter(x=>!remoteScopes.includes(x));
          const baselineFunctions=['doGet','doPost','authenticate','bootstrap','testAllSheetsReadOnly',
            'mutateItemSafely_','runIsolatedItemWriteTrialOnce_'];
          const baseline=baselineFunctions.map(name=>({name,present:remote.includes('function '+name+'(')}));
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex').slice(0,12);
          const report=[
            'READ_ONLY_GAS_AUDIT: Test GAS source retrieved without modifying project or Sheets.',
            'Remote scripts: '+remoteFiles.length,
            'Remote matches previous verified GitHub gas source: '+(sha(priorSource)===sha(remote)),
            'Remote and branch script source identical: '+(sha(local)===sha(remote)),
            'Remote source SHA256: '+crypto.createHash('sha256').update(remote).digest('hex'),
            'Remote manifest SHA256: '+crypto.createHash('sha256').update(remoteManifest).digest('hex'),
            'Manifest JSON identical: '+manifestMatches,
            'Remote manifest keys: '+Object.keys(remoteConf).sort().join(', '),
            'Remote and branch OAuth scope sets identical: '+(JSON.stringify(localScopes)===JSON.stringify(remoteScopes)),
            'Source-required OAuth scopes missing on target: '+(missingScopes.length?missingScopes.join(', '):'none'),
            'Target uses V8: '+(remoteConf.runtimeVersion==='V8'),
            'Remote-only named functions: '+(remoteOnly.length?remoteOnly.join(', '):'none'),
            'Remote-only function count: '+remoteOnly.length,
            'Remote source bytes: '+Buffer.byteLength(remote),
            'Remote existing baseline functions:',
            ...baseline.map(x=>'- '+x.name+': '+(x.present?'YES':'NO')),
            'Remote contains catalog/alias review and trial functions:',
            ...match.map(x=>'- '+x.name+': '+(x.present?'YES':'NO')),
            'No source code, script ID, token, or Sheet data included.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,report.join('\n')+'\n');
          console.log(report.join('\n'));
          NODE
      - name: Delete temporary authentication and downloaded code
        if: always()
        shell: bash
        run: rm -rf "$HOME/.clasprc.json" "$RUNNER_TEMP/remote-gas"
