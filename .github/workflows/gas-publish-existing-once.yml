name: Update the same existing test GAS webapp once
# One-time, target-pinned release of ALREADY synced source. No new deployment.
on:
  push:
    branches: [stage-a-ui-handoff-review]
    paths: ['.github/workflows/gas-publish-existing-once.yml']
permissions:
  contents: read
concurrency:
  group: household-existing-gas-webapp-deployment
  cancel-in-progress: false
jobs:
  existing-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact script and PWA source pin
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID_TEST: ${{ secrets.GAS_SCRIPT_ID_TEST }}
        shell: bash
        run: |
          set -euo pipefail
          cp gas/Code.gs "$RUNNER_TEMP/check-source.js"
          node --check "$RUNNER_TEMP/check-source.js"
          test "$(git hash-object gas/Code.gs)" = "bff3899654d6a7fff055de11baa0fcb3ca484407"
          node tests/gas-normal-dispatch.mjs
          node tests/receipt-save-parity.mjs
          mkdir -p "$RUNNER_TEMP/existing-webapp"
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path');
          const id=process.env.GAS_SCRIPT_ID_TEST,cred=process.env.CLASPRC_JSON;
          if(!id||!cred||crypto.createHash('sha256').update(id).digest('hex')!==
           '9c4113806442904861bb84dede2d9c542449a5c9ed5b494abe451cda0c1f4739')
           throw Error('EXISTING_GAS_TARGET_MISMATCH');
          const auth=JSON.parse(cred);
          if(!auth||typeof auth!=='object'||Array.isArray(auth))throw Error('INVALID_AUTH_FILE');
          fs.writeFileSync(path.join(process.env.HOME,'.clasprc.json'),cred,{mode:0o600});
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'existing-webapp','.clasp.json'),
            JSON.stringify({scriptId:id,rootDir:'.'})+'\n',{mode:0o600});
          NODE
      - name: Read current script version and list existing deployments
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/existing-webapp"
          npx --yes @google/clasp@3 pull
          npx --yes @google/clasp@3 list-deployments > "$RUNNER_TEMP/deployments-before.txt"
      - name: Fail closed unless current source and target deployment are exactly pinned
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path');
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          const folder=path.join(process.env.RUNNER_TEMP,'existing-webapp');
          const files=fs.readdirSync(folder).filter(n=>!n.startsWith('.')).sort();
          if(JSON.stringify(files)!==JSON.stringify(['appsscript.json','コード.js']))
           throw Error('REMOTE_GAS_LAYOUT_CHANGED');
          const live=fs.readFileSync(path.join(folder,'コード.js'),'utf8');
          const approved=fs.readFileSync('gas/Code.gs','utf8');
          if(sha(live)!==sha(approved))throw Error('SOURCE_NOT_SYNCED');
          const manifest=fs.readFileSync(path.join(folder,'appsscript.json'),'utf8');
          if(sha(manifest)!=='0952d47f73508eb256f1cf50f0368fe77434f8c05ea0d6defc7cf9b4e227e935')
           throw Error('MANIFEST_CHANGED');
          const source=fs.readFileSync('index.html','utf8');
          const match=source.match(/KurashiGasApi\.configure\("https:\/\/script\.google\.com\/macros\/s\/([A-Za-z0-9_-]+)\/exec"\)/);
          if(!match)throw Error('PWA_ENDPOINT_MISSING');
          const id=match[1],before=fs.readFileSync(process.env.RUNNER_TEMP+'/deployments-before.txt','utf8');
          const deployments=[...new Set(before.match(/AKfy[A-Za-z0-9_-]{20,}/g)||[])];
          if(deployments.filter(d=>d===id).length!==1)throw Error('PWA_DEPLOYMENT_NOT_IN_PINNED_SCRIPT');
          if(deployments.length!==2)throw Error('UNEXPECTED_DEPLOYMENT_COUNT');
          // The deployment ID is only an address, not credentials; keep it
          // in a private ephemeral runner file and never print it.
          fs.writeFileSync(process.env.RUNNER_TEMP+'/pinned-deployment-id',id,{mode:0o600});
          console.log('EXISTING_WEBAPP_UPDATE_PREFLIGHT_OK: exact source, manifest, script and deployment');
          NODE
      - name: Update ONLY that existing deployment with a new immutable version
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/existing-webapp"
          deployment="$(cat "$RUNNER_TEMP/pinned-deployment-id")"
          npx --yes @google/clasp@3 create-deployment --deploymentId "$deployment" --description "kurashi-stock authenticated household saves" > "$RUNNER_TEMP/deploy-result.txt"
      - name: Verify old deployment IDs are preserved, no new deployment created
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/existing-webapp"
          npx --yes @google/clasp@3 list-deployments > "$RUNNER_TEMP/deployments-after.txt"
          cd "$GITHUB_WORKSPACE"
          node - <<'NODE'
          const fs=require('node:fs');
          const read=f=>[...new Set((fs.readFileSync(process.env.RUNNER_TEMP+'/'+f,'utf8')
            .match(/AKfy[A-Za-z0-9_-]{20,}/g)||[]))].sort();
          const before=read('deployments-before.txt'),after=read('deployments-after.txt');
          const target=fs.readFileSync(process.env.RUNNER_TEMP+'/pinned-deployment-id','utf8');
          if(JSON.stringify(before)!==JSON.stringify(after)||!after.includes(target))
           throw Error('DEPLOYMENTS_CHANGED_UNEXPECTEDLY');
          console.log('EXISTING_GAS_WEBAPP_UPDATED: same deployment IDs, no new deployment or Sheet operation');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'EXISTING_GAS_WEBAPP_UPDATED: one existing webapp version updated; no new deployment and no Sheets writes.\n');
          NODE
      - name: Delete tokens and temporary source/deployment data
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.clasprc.json" "$RUNNER_TEMP/check-source.js"
          rm -rf "$RUNNER_TEMP/existing-webapp"
          rm -f "$RUNNER_TEMP/deployments-before.txt" "$RUNNER_TEMP/deployments-after.txt" "$RUNNER_TEMP/deploy-result.txt" "$RUNNER_TEMP/pinned-deployment-id"
