name: Build local OCR benchmark browser bundle (public assets only)
on:
  push:
    branches: [stage-a-ui-handoff-review]
    paths:
      - 'ocr-lab/bench.*'
      - 'ocr-lab/vite.config.mjs'
      - 'receipt-paddle.js'
      - '.github/workflows/ocr-local-browser-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact locked dependencies
        working-directory: ocr-lab
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build local browser suite and public OCR model files
        working-directory: ocr-lab
        run: npm run build
      - name: Export only public built JS runtime and official models
        uses: actions/upload-artifact@v4
        with:
          name: ocr-benchmark-browser-suite
          path: ocr-lab/dist/
          retention-days: 1
          compression-level: 0
