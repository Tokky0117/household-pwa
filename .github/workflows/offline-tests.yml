name: Offline regression tests (no GAS access)

on:
  push:
    branches:
      - stage-a-ui-handoff-review
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check auth.js
          node --check gas-api.js
          node --check live-operation-journal.js
          node --check app.js
          cp gas/Code.gs /tmp/kurashi-gas-check.js
          node --check /tmp/kurashi-gas-check.js
      - name: Durable item journal and account-scoped explicit retry
        run: node tests/live-operation-journal.mjs
      - name: GAS item mutation mock integration tests
        run: node tests/gas-item-mutations.mjs
      - name: Live item mutation disabled gate
        run: node tests/live-write-gate.mjs
      - name: Live read-only Google Sheets mode regression
        run: node tests/live-view.mjs
      - name: UI offline regression
        run: node tests/ui-smoke.mjs
      - name: GAS schema and malformed input
        run: node tests/gas-offline-smoke.mjs
      - name: Google auth and household isolation
        run: node tests/gas-auth-isolation.mjs
      - name: Validate all 12 GAS sheet headers without writes
        run: node tests/gas-schema-preflight.mjs

      - name: Validate iPhone GAS handoff bundle
        run: node tests/gas-handoff.mjs

      - name: Validate GAS browser connection diagnostics
        run: node tests/gas-connection-page.mjs

      - name: Google login button initialization
        run: node tests/auth-signin.mjs
      - name: GAS read-only transport
        run: node tests/gas-transport.mjs
