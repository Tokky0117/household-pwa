name: Offline regression tests (no GAS access)

on:
  push:
    branches:
      - stage-a-ui-handoff-review
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check auth.js
          node --check gas-api.js
          node --check backend/readonly-contract.mjs
          node --check backend/pwa-readonly-client.js
          node --check backend/server.mjs
          node --check live-operation-journal.js
          node --check app.js
          node --check receipt-ocr.js
          node --check receipt-structure.js
          node --check receipt-layout.js
          node --check receipt-paddle.js
          cp gas/Code.gs /tmp/kurashi-gas-check.js
          node --check /tmp/kurashi-gas-check.js
          cp gas/trial-readonly/Code.gs /tmp/kurashi-trial-readonly-check.js
          node --check /tmp/kurashi-trial-readonly-check.js
      - name: Check recognition-only OCR accuracy metrics
        run: python3 tests/receipt-ocr-accuracy.py --self-test
      - name: Run all offline regression tests and report every failure
        shell: bash
        run: |
          failures=0
          for test in tests/receipt-yen-grouping.mjs tests/receipt-image-preprocess.mjs tests/receipt-ocr-lab.mjs tests/receipt-paddle.mjs tests/receipt-ocr-improvement.mjs tests/receipt-structure-generalization.mjs tests/receipt-structure.mjs tests/receipt-product-matching.mjs tests/receipt-alias-preflight.mjs tests/receipt-catalog-search.mjs tests/receipt-authenticated-catalog.mjs tests/receipt-confirmation-preview.mjs tests/receipt-preview-login-off.mjs tests/receipt-ocr.mjs tests/receipt-scan-ui.mjs tests/pwa-offline-shell.mjs tests/backend-readonly-contract.mjs tests/backend-pwa-client.mjs tests/gas-optimistic-ui-demo.mjs tests/gas-trial-readonly-bundle.mjs tests/live-operation-journal.mjs tests/gas-trial-setup.mjs tests/gas-isolated-trial-gate.mjs tests/gas-recovery-fault-matrix.mjs tests/gas-item-mutations.mjs tests/gas-alias-write-recovery.mjs tests/gas-trial-sheet-inventory.mjs tests/gas-read-volume-benchmark.mjs tests/live-write-gate.mjs tests/live-view.mjs tests/ui-smoke.mjs tests/gas-offline-smoke.mjs tests/gas-auth-isolation.mjs tests/gas-schema-preflight.mjs tests/gas-handoff.mjs tests/gas-trial-connection-page.mjs tests/gas-connection-page.mjs tests/auth-signin.mjs tests/gas-transport.mjs; do
            echo "::group::$test"
            if node "$test"; then
              echo "PASS $test" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Offline test failed::$test"
              echo "FAIL $test" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          echo "Total failures: $failures" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failures" -ne 0 ]; then exit 1; fi
