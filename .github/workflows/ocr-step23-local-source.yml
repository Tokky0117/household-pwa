name: Temporary export of source code for private local verification
on:
  push:
    branches: [stage-a-ui-handoff-review]
    paths: ['.github/workflows/ocr-step23-local-source.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Package only application source and generic tests
        run: tar czf /tmp/receipt-step23-source.tgz receipt-structure.js receipt-product-matching.js
      - name: Export temporary code-only package
        uses: actions/upload-artifact@v4
        with:
          name: receipt-step23-public-source
          path: /tmp/receipt-step23-source.tgz
          retention-days: 1
